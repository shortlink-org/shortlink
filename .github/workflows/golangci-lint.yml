name: golangci-lint

on:
  push:
    tags:
      - '*'
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Enable pull request commenting for golangci-lint

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One job per Go module. boundaries/api/api-gateway is deprecated and left broken on purpose.
    strategy:
      fail-fast: false
      matrix:
        module: [bff, link, metadata]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          cache: true
          cache-dependency-path: boundaries/${{ matrix.module }}/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: latest

          # Optional: working directory, useful for monorepos
          working-directory: boundaries/${{ matrix.module }}

          # Optional: golangci-lint command line arguments.
          # args: --issues-exit-code=0

          # Show only new issues if it's a pull request
          only-new-issues: true
