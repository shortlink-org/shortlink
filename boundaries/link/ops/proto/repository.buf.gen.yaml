# NOTE: protoc-gen-go-orm is a local plugin whose source no longer lives in this repository.
# The *.orm.go files it produced are committed and frozen at protoc-gen-go-orm v1.6.0; the
# proto-generate invocation is commented out in ops/Makefile/proto.mk. Relocating the plugin
# and unfreezing this template is tracked separately.
version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go-orm
    out: internal/infrastructure/repository/crud/types/v1
    opt:
      - paths=source_relative
      - orm=skip
      - pkg=v1
      - filter=Link
      - common=true
    strategy: all
  - local: protoc-gen-go-orm
    out: internal/infrastructure/repository/crud/postgres/filter
    opt:
      - paths=source_relative
      - orm=postgres
      - pkg=filter
      - filter=Link
      - common_path=github.com/shortlink-org/shortlink/boundaries/link/internal/infrastructure/repository/crud/types/v1
    strategy: all
  - local: protoc-gen-go-orm
    out: internal/infrastructure/repository/crud/mongo/filter
    opt:
      - paths=source_relative
      - orm=mongo
      - pkg=filter
      - filter=Link
      - common_path=github.com/shortlink-org/shortlink/boundaries/link/internal/infrastructure/repository/crud/types/v1
    strategy: all
  - local: protoc-gen-go-orm
    out: internal/infrastructure/repository/crud/ram/filter
    opt:
      - paths=source_relative
      - orm=ram
      - pkg=filter
      - filter=Link
      - common_path=github.com/shortlink-org/shortlink/boundaries/link/internal/infrastructure/repository/crud/types/v1
    strategy: all
